[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Maze generator with seed, '42' pattern and shortest path"
readme = "mazegen/README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["mazegen"]

[tool.setuptools.package-data]
mazegen = ["py.typed"]